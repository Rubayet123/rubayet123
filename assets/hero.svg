<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="680" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="100%" stop-color="#12181F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="680" height="280" rx="20" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="678" height="278" rx="19" stroke="#1E293B" stroke-width="1" fill="none"/>
  
  <!-- Subtle wave decoration -->
  <path d="M0 180 Q170 140 340 180 T680 160" stroke="#1E3A5F" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M0 200 Q170 160 340 200 T680 180" stroke="#1E3A5F" stroke-width="1" fill="none" opacity="0.25"/>
  
  <!-- Logo circle -->
  <circle cx="56" cy="56" r="22" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="56" y="62" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#60A5FA">R</text>
  
  <!-- Brand -->
  <text x="92" y="50" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#94A3B8" letter-spacing="1.5">RUBAYET ALAM</text>
  <text x="92" y="68" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">Developer · Automator · Data</text>
  
  <!-- Main headline -->
  <text x="40" y="130" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="#F1F5F9">
    Tools, automation
  </text>
  <text x="40" y="168" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="#F1F5F9">
    &amp; data systems.
  </text>
  
  <!-- Subtitle -->
  <text x="40" y="210" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94A3B8">
    Independent developer building practical software —
  </text>
  <text x="40" y="230" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94A3B8">
    web apps, media tools, automation pipelines &amp; more.
  </text>
  
  <!-- Accent bar -->
  <rect x="40" y="250" width="48" height="3" rx="1.5" fill="url(#accent)"/>
</svg>