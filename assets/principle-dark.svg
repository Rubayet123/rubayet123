<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="Build tools that actually matter. Ship, learn, improve."><style>.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.tl{transform-box:fill-box;transform-origin:left center}.tb{transform-box:fill-box;transform-origin:50% 100%}.tc{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes hl{0%,8%{transform:scaleX(0)}38%,70%{transform:scaleX(1)}100%{transform:scaleX(0)}}.hl{animation:hl 7s cubic-bezier(.7,0,.3,1) infinite}@keyframes lit{0%{opacity:.15}6%{opacity:1}30%{opacity:1}40%{opacity:.15}100%{opacity:.15}}.lit{animation:lit 9s ease-in-out infinite}@keyframes spin{to{stroke-dashoffset:-24}}.spin{stroke-dasharray:3 5;animation:spin 3s linear infinite}</style><defs></defs><rect class="hl tl" x="2" y="68" width="374" height="52" rx="4" fill="#ff8a4c" opacity=".22"/><text class="s" x="0" y="50" font-size="44" font-weight="800" letter-spacing="-1.5" fill="#e8ecf2">Build tools that</text><text class="s" x="0" y="106" font-size="44" font-weight="800" letter-spacing="-1.5" fill="#e8ecf2">actually matter.</text><text class="m" x="2" y="156" font-size="13" fill="#8c97a9">practical over perfect. ship, learn, improve.</text><circle class="spin" cx="730" cy="104" r="66" fill="none" stroke="#465064"/><circle class="lit tc" cx="730.0" cy="38.0" r="12" fill="#ff8a4c" fill-opacity=".18" stroke="#ff8a4c" style="animation-delay:-0.4s"/><circle cx="730.0" cy="38.0" r="4" fill="#ff8a4c"/><text class="m" x="730.0" y="25.0" font-size="12" text-anchor="middle" fill="#e8ecf2">ship</text><circle class="lit tc" cx="787.2" cy="137.0" r="12" fill="#ff8a4c" fill-opacity=".18" stroke="#ff8a4c" style="animation-delay:2.6s"/><circle cx="787.2" cy="137.0" r="4" fill="#ff8a4c"/><text class="m" x="803.2" y="142.0" font-size="12" text-anchor="start" fill="#e8ecf2">learn</text><circle class="lit tc" cx="672.8" cy="137.0" r="12" fill="#ff8a4c" fill-opacity=".18" stroke="#ff8a4c" style="animation-delay:5.6s"/><circle cx="672.8" cy="137.0" r="4" fill="#ff8a4c"/><text class="m" x="656.8" y="142.0" font-size="12" text-anchor="end" fill="#e8ecf2">improve</text><circle r="5" fill="#ff8a4c"><animateMotion dur="9s" repeatCount="indefinite" path="M730 38 A66 66 0 1 1 730 170 A66 66 0 1 1 730 38"/></circle><text class="m" x="730" y="108" font-size="10" letter-spacing="2" text-anchor="middle" fill="#8c97a9">LOOP</text></svg>
