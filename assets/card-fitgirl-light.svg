<svg xmlns="http://www.w3.org/2000/svg" width="442" height="246" viewBox="0 0 442 246" role="img" aria-label="FitGirl Downloader Pro"><style>.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.tl{transform-box:fill-box;transform-origin:left center}.tb{transform-box:fill-box;transform-origin:50% 100%}.tc{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes chase{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}.chase{stroke-dasharray:14 86;animation:chase 9s linear infinite}@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}.nudge{animation:nudge 1.8s ease-in-out infinite}@keyframes dl{0%{transform:scaleX(0)}88%{transform:scaleX(1)}100%{transform:scaleX(1)}}@keyframes arc{0%{stroke-dashoffset:100}88%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}@keyframes dn{0%,100%{transform:translateY(-1.5px)}50%{transform:translateY(1.5px)}}.dn{animation:dn 1.2s ease-in-out infinite}</style><defs></defs><rect x=".5" y=".5" width="441" height="245" rx="13" fill="#f6f7f9" stroke="#dbe0e8"/><rect class="chase" x="1" y="1" width="440" height="244" rx="12.5" fill="none" stroke="#d9531e" stroke-width="1.5" pathLength="100" opacity=".9"/><text class="m" x="20" y="32" font-size="11" fill="#d9531e">01<tspan fill="#5a6476">   /   Desktop app</tspan></text><text class="m" x="398" y="32" font-size="11" text-anchor="end" fill="#d9531e">Download release</text><g transform="translate(408,28)"><path class="nudge" d="M0 0H12M8 -4L12 0L8 4" fill="none" stroke="#d9531e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><text class="s" x="20" y="72" font-size="21" font-weight="700" letter-spacing="-.3" fill="#14181f">FitGirl Downloader Pro</text><text class="s" x="20" y="96" font-size="13" fill="#5a6476">Native download manager for game repacks.</text><text class="s" x="20" y="114" font-size="13" fill="#5a6476">Real-time CDN link extraction, multi-threaded, OLED UI.</text><rect x="20.5" y="130.5" width="401" height="59" rx="10" fill="#ffffff" stroke="#dbe0e8"/><text class="m" x="34" y="144.4" font-size="8.5" fill="#5a6476">chunk 1</text><rect x="84" y="139.0" width="262" height="5" rx="2.5" fill="#e7eaf0"/><rect class="tl" x="84" y="139.0" width="262" height="5" rx="2.5" fill="#0e8f82" style="animation:dl 3.1s ease-in-out infinite"/><text class="m" x="34" y="156.9" font-size="8.5" fill="#5a6476">chunk 2</text><rect x="84" y="151.5" width="262" height="5" rx="2.5" fill="#e7eaf0"/><rect class="tl" x="84" y="151.5" width="262" height="5" rx="2.5" fill="#0e8f82" style="animation:dl 2.4s ease-in-out infinite"/><text class="m" x="34" y="169.4" font-size="8.5" fill="#5a6476">chunk 3</text><rect x="84" y="164.0" width="262" height="5" rx="2.5" fill="#e7eaf0"/><rect class="tl" x="84" y="164.0" width="262" height="5" rx="2.5" fill="#0e8f82" style="animation:dl 3.8s ease-in-out infinite"/><text class="m" x="34" y="181.9" font-size="8.5" fill="#5a6476">chunk 4</text><rect x="84" y="176.5" width="262" height="5" rx="2.5" fill="#e7eaf0"/><rect class="tl" x="84" y="176.5" width="262" height="5" rx="2.5" fill="#0e8f82" style="animation:dl 2.9s ease-in-out infinite"/><circle cx="386" cy="160" r="15" fill="none" stroke="#dbe0e8" stroke-width="3"/><circle class="tc" cx="386" cy="160" r="15" fill="none" stroke="#d9531e" stroke-width="3" stroke-linecap="round" pathLength="100" stroke-dasharray="100" transform="rotate(-90 386 160)" style="animation:arc 4s ease-in-out infinite"/><g transform="translate(386,160)"><path class="dn" d="M0 -5V4M-4.5 0L0 4.5L4.5 0" fill="none" stroke="#d9531e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="20.0" y="204.5" width="50.0" height="22" rx="11" fill="none" stroke="#dbe0e8"/><text class="m" x="45.0" y="219" font-size="10.5" text-anchor="middle" fill="