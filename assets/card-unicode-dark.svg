<svg xmlns="http://www.w3.org/2000/svg" width="442" height="246" viewBox="0 0 442 246" role="img" aria-label="Unicode Inspector"><style>.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.tl{transform-box:fill-box;transform-origin:left center}.tb{transform-box:fill-box;transform-origin:50% 100%}.tc{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes chase{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}.chase{stroke-dasharray:14 86;animation:chase 9s linear infinite}@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}.nudge{animation:nudge 1.8s ease-in-out infinite}@keyframes pop{0%,4%{opacity:0;transform:scale(.6)}12%,80%{opacity:1;transform:scale(1)}92%,100%{opacity:0;transform:scale(.6)}}.pop{animation:pop 7s ease-in-out infinite}@keyframes beam{from{transform:translateX(0)}to{transform:translateX(289.0px)}}.beam{animation:beam 7s linear infinite}</style><defs></defs><rect x=".5" y=".5" width="441" height="245" rx="13" fill="#131a23" stroke="#273040"/><rect class="chase" x="1" y="1" width="440" height="244" rx="12.5" fill="none" stroke="#ff8a4c" stroke-width="1.5" pathLength="100" opacity=".9"/><text class="m" x="20" y="32" font-size="11" fill="#ff8a4c">04<tspan fill="#8c97a9">   /   Developer utility</tspan></text><text class="m" x="398" y="32" font-size="11" text-anchor="end" fill="#ff8a4c">Open tool</text><g transform="translate(408,28)"><path class="nudge" d="M0 0H12M8 -4L12 0L8 4" fill="none" stroke="#ff8a4c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><text class="s" x="20" y="72" font-size="21" font-weight="700" letter-spacing="-.3" fill="#e8ecf2">Unicode Inspector</text><text class="s" x="20" y="96" font-size="13" fill="#8c97a9">Reveal invisible and non-printable Unicode characters.</text><text class="s" x="20" y="114" font-size="13" fill="#8c97a9">Built for debugging hidden text issues.</text><rect x="20.5" y="130.5" width="401" height="59" rx="10" fill="#0d1117" stroke="#273040"/><text class="m" x="36.0" y="166" font-size="17" fill="#e8ecf2">a</text><text class="m" x="47.5" y="166" font-size="17" fill="#e8ecf2">d</text><g class="pop tc" style="animation-delay:0.0s"><rect x="63.0" y="152" width="46" height="16" rx="4" fill="#ff8a4c" fill-opacity=".16" stroke="#ff8a4c"/><text class="m" x="86.0" y="163" font-size="8.5" text-anchor="middle" fill="#ff8a4c">U+200B</text></g><text class="m" x="115.0" y="166" font-size="17" fill="#e8ecf2">m</text><text class="m" x="126.5" y="166" font-size="17" fill="#e8ecf2">i</text><text class="m" x="138.0" y="166" font-size="17" fill="#e8ecf2">n</text><g class="pop tc" style="animation-delay:0.7s"><rect x="159.5" y="152" width="46" height="16" rx="4" fill="#ff8a4c" fill-opacity=".16" stroke="#ff8a4c"/><text class="m" x="182.5" y="163" font-size="8.5" text-anchor="middle" fill="#ff8a4c">U+00A0</text></g><text class="m" x="211.5" y="166" font-size="17" fill="#e8ecf2">l</text><text class="m" x="223.0" y="166" font-size="17" fill="#e8ecf2">o</text><text class="m" x="234.5" y="166" font-size="17" fill="#e8ecf2">g</text><text class="m" x="246.0" y="166" font-size="17" fill="#e8ecf2">i</text><text class="m" x="257.5" y="166" font-size="17" fill="#e8ecf2">n</text><g class="pop tc" style="animation-delay:1.4s"><rect x="273.0" y="152" width="46" height="16" rx="4" fill="#ff8a4c" fill-opacity=".16" stroke="#ff8a4c"/><text class="m" x="296.0" y="163" font-size="8.5" text-anchor="middle" fill="#ff8a4c">U+200D</text></g><rect class="beam" x="36" y="138" width="1.5" height="44" fill="#ff8a4c" opacity=".6"/><text class="m" x="408" y="164" font-size="9" text-anchor="end" fill="#8c97a9">3 hidden</text><rect x="20.0" y="204.5" width="43.6" height="22" rx="11" fill="none" stroke="#273040"/><text class="m" x="41.8" y="219" font-size="10