<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64" role="img" aria-label="What I build"><style>.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.tl{transform-box:fill-box;transform-origin:left center}.tb{transform-box:fill-box;transform-origin:50% 100%}.tc{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes sweep{from{stroke-dashoffset:90}to{stroke-dashoffset:-544.4}}.sw{stroke-dasharray:90 544.4;animation:sweep 5s linear infinite}@keyframes sq{0%,100%{opacity:1}50%{opacity:.3}}.sq{animation:sq 2.4s ease-in-out infinite}</style><defs></defs><text class="m" x="0" y="38" font-size="13" fill="#ff8a4c">01</text><text class="s" x="34" y="40" font-size="26" font-weight="700" letter-spacing="-.5" fill="#e8ecf2">What I build</text><line x1="238.4" y1="30" x2="782.8" y2="30" stroke="#273040"/><line class="sw" x1="238.4" y1="30" x2="782.8" y2="30" stroke="#ff8a4c" stroke-width="1.6" stroke-linecap="round"/><rect class="sq" x="780.3" y="27.5" width="5" height="5" fill="#ff8a4c"/><text class="m" x="900" y="34" font-size="11" letter-spacing="1.5" text-anchor="end" fill="#8c97a9">CAPABILITIES</text></svg>
